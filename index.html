<style>
:root{
  /* Tek sütun, telefon öncelikli: tur çipleri yana kayar, maç kartları alt alta dizilir. */
  --bg:#ece6da; --surface:#fffdf8; --ink:#1f1912; --muted:#6f6454; --line:#d9cfbe;
  --accent:#7a4318; --accent-ink:#fff7ec; --win:#1b6440; --win-bg:#dfeee4; --danger:#a3271f;
  --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151110; --surface:#211b17; --ink:#f1eadf; --muted:#a4978a; --line:#3b3129;
    --accent:#d58d52; --accent-ink:#1a110a; --win:#79cf9b; --win-bg:#1d3527; --danger:#ff8f86;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hdr{position:relative;color:#f6efe0;background:#0f1a2e var(--hero) center 42%/cover no-repeat}
.hdr::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,15,30,.42) 0%,rgba(8,15,30,.72) 55%,rgba(8,15,30,.9) 100%)}
.points{display:block;width:100%;height:18px;position:relative;z-index:1}
.hdr .wrap{position:relative;padding-top:14px;padding-bottom:18px;display:flex;flex-direction:column;gap:2px}
.hdr .titlerow{display:flex;align-items:flex-start;gap:12px}
.hdr .titlerow > div{flex:1;min-width:0}
.emblem{flex:0 0 auto;width:54px;height:54px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.35);margin-top:4px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:rgba(246,239,224,.8)}
.hdr .sub{color:rgba(246,239,224,.82)}
.hdr .back{color:rgba(246,239,224,.85)}
.hdr .back:hover{color:#fff}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink)}
.pill.live{background:var(--win);color:#fff}
h1{margin:4px 0 2px;font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.05;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
main .wrap{padding-top:16px;padding-bottom:24px;display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.02em}
h2 .cnt{color:var(--muted);font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=password],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:46px}
textarea{resize:vertical;line-height:1.5}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.big{width:100%;min-height:52px;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.stack{display:flex;flex-direction:column;gap:10px}
.hint{margin:0;color:var(--muted);font-size:14px}
.plist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:50px}
.plist li+li{border-top:1px solid var(--line)}
.plist .no{width:26px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.plist .nm{flex:1;font-weight:500;overflow-wrap:anywhere}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);background:transparent}
.tag.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn{min-width:40px;min-height:40px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:baseline;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.chip .n{font-size:13px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.matches{display:flex;flex-direction:column;gap:12px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mhead .st{flex:1}
.mhead .undo{min-height:30px;padding:0 10px;font-size:13px;text-transform:none;letter-spacing:0}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;min-height:52px}
.row+.row{border-top:1px solid var(--line)}
.row .nm{flex:1;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.row.empty .nm{color:var(--muted);font-weight:500;font-size:15px}
.row.win{background:var(--win-bg);color:var(--win)}
.row.lose .nm{color:var(--muted);font-weight:500}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--bg)}
.row.tap .nm::after{content:"Kazandı ›";font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:10px;border:1px solid var(--accent);border-radius:999px;padding:3px 9px;white-space:nowrap}
.mark{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--win);color:#fff}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg)}
.confirm .acts{display:flex;gap:8px}
.confirm .acts .btn{flex:1}
.podium{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.podium .place{grid-column:1/-1}
.podium .p{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.podium .p.first{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.podium .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.podium .who{font-family:var(--font-display);font-size:28px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.podium .p.first .who{font-size:36px}
.foot{display:flex;flex-direction:column;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.foot .acts{display:flex;gap:8px;flex-wrap:wrap}
.credit{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.credit img{width:24px;height:24px;border-radius:50%;background:#fff;flex:0 0 auto}
.podium .p.first{position:relative;overflow:hidden}
.podium .pemb{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;background:#fff;opacity:.95}
.podium .p.first .who{padding-right:70px}
.me{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--accent)}
.me .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me select{min-height:46px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.flag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--danger);color:#fff}
.codes{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.codes li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
.codes li+li{border-top:1px solid var(--line)}
.codes b{font-family:var(--font-display);font-size:18px;letter-spacing:.08em}
.treewrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.treehead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.treehead h2{font-size:20px}
.treehead .hint{font-size:12px}
.tree{overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 14px}
.trow{display:flex;align-items:flex-start}
.tcol{flex:0 0 auto;width:148px;display:flex;flex-direction:column;justify-content:space-around}
.tgap{flex:0 0 auto;width:22px;display:block}
.tlabel{flex:0 0 auto;width:148px;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:8px;white-space:nowrap}
.tlabel.gap{width:22px}
.bm{height:58px;border:1px solid var(--line);border-radius:8px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.bm.final{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bm.mine{border-color:var(--accent)}
.bm.live{border-style:dashed}
.bn{flex:1;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn+.bn{border-top:1px solid var(--line)}
.bn.w{background:var(--win-bg);color:var(--win)}
.bn.l{color:var(--muted);font-weight:500}
.bn.e{color:var(--muted);font-weight:500;font-style:italic}
.bn .sm{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:999px;background:var(--win);color:#fff;flex:0 0 auto}
.tthird{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:14px}
.tthird .tlabel{padding:0}
.tthird .bm{width:148px}
.saving{position:fixed;left:0;right:0;top:0;padding:8px 16px;text-align:center;background:var(--accent);color:var(--accent-ink);font-weight:600;z-index:5}
.toast{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:500;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.notice{padding:10px 12px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
.tcard .tn{flex:1;font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.tcard .tm{color:var(--muted);font-size:13px;margin-top:2px;font-family:var(--font-body);font-weight:500}
.tcard .arrow{color:var(--muted);font-size:20px}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.back:hover{color:var(--ink)}
.share{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.share .lnk{font-size:13px;color:var(--muted);word-break:break-all;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--bg)}
.share .acts{display:flex;gap:8px;flex-wrap:wrap}
.share .acts .btn{flex:1}
.btn.wa{background:#1f8f4e;color:#fff;border-color:#1f8f4e;text-decoration:none}
.ocr{display:flex;flex-direction:column;gap:10px}
.ocr input[type=file]{display:none}
.ocrlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ocrlist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ocrlist input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
.ocrlist input[type=text]{min-height:38px;padding:6px 10px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

  if(r === R-2) return 'Yarı Final';
  var ms = liveMs(r);
  if(r === R-3 && ms.length === 4 && ms.every(function(x){ return !x.solo && !(r === 0 && x.bye); })) return 'Çeyrek Final';
  return (r+1) + '. Tur';
}
function dispNum(r, m){ var n = 0; for(var i = 0; i <= m; i++) if(!S.rounds[r][i].dead) n++; return n; }
function currentRound(){
  for(var r=0;r<S.rounds.length;r++){ if(S.rounds[r].some(function(x){ return !x.dead && !x.w; })) return r; }
  if(S.third && !S.third.w) return 't';
  return S.rounds.length - 1;
}
function finalists(){
  var f = S.rounds[S.rounds.length-1][0];
  return { first: f.w, second: f.w ? (f.w === f.a ? f.b : f.a) : null };
}
function canClear(r, m){
  var R = S.rounds.length;
  if(S.third && r === R-2 && S.third.w && !S.third.bye) return false;
  if(r+1 >= R) return true;
  var nx = S.rounds[r+1][m>>1];
  if(nx.solo) return canClear(r+1, m>>1);
  return !nx.w;
}
function canUndo(r, m){
  var match = S.rounds[r][m]; if(!match.w || match.bye) return false;

}

function row(id, match, side, ctx){

  var mark = isWin ? '<span class="mark">' + (match.bye ? 'Tur atladı' : 'Kazandı') + '</span>' : '';
  return '<div class="' + cls + '"' + attrs + '><span class="nm">' + esc(nameOf(id)) + '</span>' + mark + '</div>';

function matchCard(match, ctx, num){
  var st, undoBtn = '', flag = '';
  if(match.bye) st = 'Bay · tur atladı';
  else if(match.solo) st = 'Bay · rakipsiz tur atlayacak';
  else if(match.w) st = 'Oynandı' + (match.by ? ' · ' + esc(nameOf(match.by)) + ' girdi' : '');
  else if(match.a && match.b) st = (ui.admin || inMatch(match)) ? 'Oynanacak · kazanan kendi adına dokunsun' : 'Oynanacak';
  else st = 'Rakip bekleniyor';
  if(match.flag) flag = '<span class="flag">İtiraz var</span>';
  var undoable = ctx.key === 't' ? canUndoThird() : canUndo(ctx.r, ctx.m);
  if(ui.admin && undoable && !ui.saving) undoBtn = '<button class="btn sm undo" data-act="undo" data-key="' + ctx.key + '">Geri al</button>';
  else if(!ui.admin && match.w && !match.bye && inMatch(match) && match.flag !== ui.me.id && !ui.saving) undoBtn = '<button class="btn sm undo" data-act="dispute" data-key="' + ctx.key + '">İtiraz et</button>';
  var h = '<article class="match"><div class="mhead"><span>' + num + '. maç</span><span class="st">' + st + '</span>' + flag + undoBtn + '</div>';
  h += row(match.a, match, 'a', ctx) + row(match.b, match, 'b', ctx);

       + '<div class="acts"><button class="btn primary" data-act="confirm">Evet, kaydet</button><button class="btn" data-act="cancel">Vazgeç</button></div></div>';
  }

function treeBox(match, r, m, extraCls){
  var cls = 'bm' + (extraCls ? ' ' + extraCls : '') + (meValid() && (match.a === ui.me.id || match.b === ui.me.id) ? ' mine' : '') + (!match.w && match.a && match.b ? ' live' : '');
  function nm(id, other, side){
    if(!id){
      var emptyBye = match.solo && (r === 0 || (r !== 't' && S.rounds[r-1][m*2 + side].dead));
      return '<div class="bn e">' + (emptyBye ? 'bay' : '…') + '</div>';
    }
    var c = 'bn' + (match.w === id ? ' w' : (match.w ? ' l' : ''));
    return '<div class="' + c + '"><span style="overflow:hidden;text-overflow:ellipsis">' + esc(nameOf(id)) + '</span>' + (match.w === id ? '<span class="sm">' + (match.bye ? 'bay' : 'W') + '</span>' : '') + '</div>';
  }
  var key = (r === 't') ? 't' : r;
  return '<div class="' + cls + '" data-act="chip" data-r="' + key + '" role="button" tabindex="0" title="' + (m + 1) + '. maç">' + nm(match.a, match.b, 0) + nm(match.b, match.a, 1) + '</div>';
}
function treeView(){
  var R = S.rounds.length; if(!R) return '';
  var CELL = 68, BOX = 58, GAPW = 22;
  var pos = {};
  function key(r, m){ return r + ':' + m; }
  function kids(r, m){
    if(r === 0) return [];
    var out = [];
    [m*2, m*2+1].forEach(function(c){ var x = S.rounds[r-1][c]; if(x && !x.dead) out.push(c); });
    return out;
  }
  function layout(r, m, ctr){
    var ks = kids(r, m);
    if(!ks.length){ var y = ctr.n * CELL + CELL / 2; ctr.n++; pos[key(r, m)] = y; return y; }
    var ys = ks.map(function(c){ return layout(r-1, c, ctr); });
    var yy = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2; pos[key(r, m)] = yy; return yy;
  }
  var L = {n:0}, Rt = {n:0};
  if(R >= 2){ layout(R-2, 0, L); layout(R-2, 1, Rt); }
  var H = Math.max(L.n, Rt.n, 1) * CELL;
  // her iki yarıyı dikey ortala
  var offL = (H - L.n * CELL) / 2, offR = (H - Rt.n * CELL) / 2;
  function isLeft(r, m){ return m < S.rounds[r].length / 2; }
  function y(r, m){ return pos[key(r, m)] + (isLeft(r, m) ? offL : offR); }
  if(R >= 2) pos[key(R-1, 0)] = ((y(R-2, 0) + y(R-2, 1)) / 2);
  else pos[key(0, 0)] = H / 2;
  function yF(){ return pos[key(R-1, 0)]; }
  function col(r, left){
    var h = '<div class="tcol" style="height:' + H + 'px;position:relative;display:block">';
    S.rounds[r].forEach(function(mt, m){
      if(mt.dead || isLeft(r, m) !== left) return;
      h += '<div style="position:absolute;left:0;right:0;top:' + Math.round(y(r, m) - BOX/2) + 'px">' + treeBox(mt, r, m, '') + '</div>';
    });
    return h + '</div>';
  }
  function gap(r, left){ // r -> r+1 arası çizgiler
    var st = 'stroke="var(--line)" stroke-width="2" fill="none"';
    var h = '<svg class="tgap" width="' + GAPW + '" height="' + H + '" viewBox="0 0 ' + GAPW + ' ' + H + '" aria-hidden="true">';
    var x0 = left ? 0 : GAPW, x2 = left ? GAPW : 0, x1 = GAPW / 2;
    S.rounds[r+1].forEach(function(pm, m){
      if(pm.dead) return;
      if(r+1 < R-1 && isLeft(r+1, m) !== left) return;
      var py = (r+1 === R-1) ? yF() : y(r+1, m);
      kids(r+1, m).forEach(function(c){
        if(isLeft(r, c) !== left) return;
        var cy = y(r, c);
        h += '<path d="M' + x0 + ' ' + cy + ' H' + x1 + ' V' + py + ' H' + x2 + '" ' + st + '/>';
      });
    });
    return h + '</svg>';
  }
  var labels = '', cols = '', r;
  for(r = 0; r < R - 1; r++){
    labels += '<div class="tlabel">' + esc(roundName(r)) + '</div><div class="tlabel gap"></div>';
    cols += col(r, true) + gap(r, true);
  }
  labels += '<div class="tlabel">Final</div>';
  cols += '<div class="tcol" style="height:' + H + 'px;position:relative;display:block"><div style="position:absolute;left:0;right:0;top:' + Math.round(yF() - BOX/2) + 'px">' + treeBox(S.rounds[R - 1][0], R - 1, 0, 'final') + '</div></div>';
  for(r = R - 2; r >= 0; r--){
    labels += '<div class="tlabel gap"></div><div class="tlabel">' + esc(roundName(r)) + '</div>';
    cols += gap(r, false) + col(r, false);
  }
  var third = S.third ? '<div class="tthird"><div class="tlabel">3.lük maçı</div>' + treeBox(S.third, 't', 0, '') + '</div>' : '';
  return '<section class="treewrap"><div class="treehead"><h2>Finale giden yol</h2><span class="hint">Sağa-sola kaydır · maça dokun</span></div>'
    + '<div class="tree" id="tree"><div class="trow">' + labels + '</div><div class="trow">' + cols + '</div>' + third + '</div></section>';
}
function chips(){
  var h = '<div class="chips" role="tablist" aria-label="Turlar">';
  for(var r=0;r<S.rounds.length;r++){
    var total = 0, done = 0;

}
function podium(){

function liveView(){

  h += shareBlock();

}

var OWNER_NAME = 'Mertcan Sezer';
var ocrLoading = null;
function loadOcr(cb){
  if(window.Tesseract){ cb(null); return; }
  if(ocrLoading){ ocrLoading.push(cb); return; }
  ocrLoading = [cb];
  var sc = document.createElement('script');
  sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

var NAME_TOKEN = /^[A-ZÇĞİÖŞÜÂÎÛ][a-zçğıöşüâîû'\.\-]*(?:[A-ZÇĞİÖŞÜ][a-zçğıöşüâîû'\.\-]+)*$/;
var TS_RE = /(bugün|bugun|dün|dun|today|yesterday)\s*\d{1,2}\s*[:.]?\s*\d{2}|\b\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}\b|\b(pazartesi|salı|çarşamba|perşembe|cuma|cumartesi|pazar)\b\s*\d{1,2}[:.]\d{2}/i;
function cleanName(s, loose){
  s = String(s || '').replace(/[\t|]+/g, ' ');
  // @kullanıcı / ©kullanıcı etiketi ve sonrası
  s = s.replace(/\s[@©®][^\s]*.*$/, '');
  var toks = s.split(/\s+/).filter(Boolean).map(function(t){ return t.replace(/^[~“”"'‘’«»<>\(\)\[\]\{\}\*•·►▪:;,\.\-]+|[“”"'‘’«»<>\(\)\[\]\{\}\*•·►▪:;,\.\-]+$/g, ''); }).filter(Boolean);
  if(toks.length === 1 && /^siz$/i.test(toks[0])) return OWNER_NAME;
  // baştaki ve sondaki gürültüyü at (kısa / küçük harfli / rakamlı / büyük harf olmayan parçalar)
  function good(t){ return t.length >= 3 && NAME_TOKEN.test(t); }
  while(toks.length && !good(toks[0])) toks.shift();
  while(toks.length && !good(toks[toks.length - 1])) toks.pop();
  if(!toks.length) return '';
  if(toks.some(function(t){ return /\d/.test(t); })) return '';
  // "CevatMertUzer" -> "Cevat Mert Uzer"
  toks = toks.join(' ').replace(/([a-zçğıöşüâîû])([A-ZÇĞİÖŞÜ])/g, '$1 $2').split(' ');
  var s2 = toks.join(' ');
  if(/^siz$/i.test(s2)) return OWNER_NAME;
  if(s2.length < 3 || s2.length > 40 || toks.length > 5) return '';
  if(!loose && toks.length < 2) return '';
  if(/^(anket detayları|anket|tavla|bugün|dün|oy|oylar|sil)$/i.test(s2) || /^anket/i.test(s2)) return '';
  return s2;
}
function parseNames(text){
  var lines = String(text).split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  var out = [], seen = {};
  function push(n){ var k = n.toLocaleLowerCase('tr'); if(seen[k]) return; seen[k] = true; out.push(n); }
  var anchors = 0;
  lines.forEach(function(l, i){
    if(!TS_RE.test(l)) return;
    anchors++;
    // zaman satırının hemen üstündeki isim satırı (en fazla 3 satır geri bak)
    for(var j = i - 1; j >= 0 && j >= i - 3; j--){
      if(TS_RE.test(lines[j])) break;
      var n = cleanName(lines[j], true);
      if(n){ push(n); break; }
    }
  });
  if(anchors >= 2) return out;
  lines.forEach(function(l){ var n = cleanName(l, false); if(n) push(n); });
  return out;
}
function mergeOcrNames(names){
  var have = {};
  (ui.ocrNames || []).forEach(function(n){ have[n.toLocaleLowerCase('tr')] = true; });
  S.players.forEach(function(p){ have[p.name.toLocaleLowerCase('tr')] = true; });
  var out = (ui.ocrNames || []).slice();
  names.forEach(function(n){ var k = n.toLocaleLowerCase('tr'); if(!have[k]){ have[k] = true; out.push(n); } });
  return out;
}
function ocrFromFiles(files){
  var list = Array.prototype.slice.call(files || []);
  if(!list.length) return;
  ui.ocrBusy = true; if(!ui.ocrNames) ui.ocrNames = []; render();
  var idx = 0, found = 0, failed = 0;
  function next(){
    if(idx >= list.length){
      ui.ocrBusy = false;
      if(!found && failed) toast('Fotoğraf okunamadı.');
      else if(!found) toast('Fotoğrafta isim bulunamadı.');
      else toast(found + ' isim okundu, kontrol edip ekle.');
      render(); return;
    }
    var file = list[idx++];
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      try {
        var tw = 1200, sc = tw / img.width, W = tw, H = Math.round(img.height * sc);
        var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        var ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, W, H);
        URL.revokeObjectURL(url);
        var id = ctx.getImageData(0, 0, W, H), d = id.data, sum = 0, cnt = 0;
        for(var i = 0; i < d.length; i += 40){ sum += (d[i] * 299 + d[i+1] * 587 + d[i+2] * 114) / 1000; cnt++; }
        if(cnt && sum / cnt < 110){
          for(var j = 0; j < d.length; j += 4){ d[j] = 255 - d[j]; d[j+1] = 255 - d[j+1]; d[j+2] = 255 - d[j+2]; }
          ctx.putImageData(id, 0, 0);
        }
        // uzun ekran görüntülerini üst üste binen dilimlere böl
        var strips = [], SH = 1100, STEP = 950;
        for(var y = 0; y < H; y += STEP){
          var h2 = Math.min(SH, H - y), sv = document.createElement('canvas'); sv.width = W; sv.height = h2;
          sv.getContext('2d').drawImage(cv, 0, y, W, h2, 0, 0, W, h2); strips.push(sv);
          if(y + SH >= H) break;
        }
        loadOcr(function(err){
          if(err){ failed++; toast('Okuma aracı yüklenemedi, internetini kontrol et.'); next(); return; }
          var texts = [], k = 0;
          (function step(){
            if(k >= strips.length){
              var names = parseNames(texts.join('\n'));
              var before = ui.ocrNames.length; ui.ocrNames = mergeOcrNames(names); found += ui.ocrNames.length - before;
              next(); return;
            }
            window.Tesseract.recognize(strips[k++], 'tur').then(function(r){ texts.push((r && r.data && r.data.text) || ''); step(); }, function(){ step(); });
          })();
        });
      } catch(e){ failed++; toast('Fotoğraf işlenemedi: ' + e.message); next(); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); failed++; next(); };
    img.src = url;
  }
  next();
}
